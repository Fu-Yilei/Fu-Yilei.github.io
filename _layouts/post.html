---
layout: default
---
<article class="container article-layout">
  <header class="article-header"><a class="text-link" href="{{ '/notes/' | relative_url }}">All notes</a><p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.categories.size > 0 %} · {{ page.categories | join: ' / ' }}{% endif %}</p><h1>{{ page.title }}</h1></header>
  <div class="prose article-body">{{ content }}</div>
  <div class="article-end"><p>Written by Yilei Fu</p><a class="text-link" href="{{ '/notes/' | relative_url }}">More notes & writing</a></div>
</article>
