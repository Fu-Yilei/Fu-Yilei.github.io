<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}{% unless page.title %} · Computational genomics{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#164c47">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.layout == 'post' %}
  <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] } };</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" defer></script>
  {% endif %}
  {% if jekyll.environment == 'production' and site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', '{{ site.google_analytics }}');</script>
  {% endif %}
</head>
<body class="{% if page.section %}section-{{ page.section }}{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Yilei Fu, home">Yilei Fu</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>Menu<span aria-hidden="true">☰</span></button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="{{ '/research/' | relative_url }}" {% if page.section == 'research' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.section == 'publications' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/software/' | relative_url }}" {% if page.section == 'software' %}aria-current="page"{% endif %}>Software</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/notes/' | relative_url }}" {% if page.section == 'notes' %}aria-current="page"{% endif %}>Notes</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-inner"><span>© {{ site.time | date: '%Y' }} Yilei Fu</span><div><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="https://github.com/{{ site.repository }}">Site source</a></div></div>
  </footer>
</body>
</html>
